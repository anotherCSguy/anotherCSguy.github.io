    <h1>CONTACT</h1>
    <!-- Contact form for users to fill out and submit-->
    <form id="contact-form" class="contact-form" action="mailto:milleredm.19@gmail.com" method="post" enctype="text/plain">
      
      <!-- Title field for user input-->
      <div class="form-row">
        <label for="title">Title</label>
        <select id="title" name="title" required>
          <option value="">Select title</option>
          <option>Mr.</option>
          <option>Ms.</option>
          <option>Dr.</option>
          <option>Prof.</option>
        </select>
      </div>
      <!-- Full name fields for user input-->
      <div class="form-row">
        <label for="full-name">Full Name</label>
        <input id="full-name" name="full-name" type="text" placeholder="Enter your full name" required>
      </div>
      <!-- Email fields for user input-->
      <div class="form-row">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="Enter your email address" required>
      </div>
      <!-- Reason for contact fields for user input-->
      <div class="form-row">
        <label for="topic">Reason for contact</label>
        <select id="topic" name="topic" required>
          <option value="">Choose an option</option>
          <option>Resume review</option>
          <option>Project inquiry</option>
          <option>Career advice</option>
          <option>Other</option>
        </select>
      </div>
      <!-- Message field for user input-->
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Type your message here" required></textarea>
      </div>
      
      <!-- A button that you click-->
      <button type="submit">Submit</button>
    </form>

    <footer class="contact-footer">
      <div class="contact-item">
        Elisha Miller
      </div>
